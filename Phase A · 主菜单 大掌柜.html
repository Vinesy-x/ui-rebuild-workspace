<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>Phase A · 大掌柜 主菜单</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;700;900&family=ZCOOL+XiaoWei&family=Ma+Shan+Zheng&family=ZCOOL+QingKe+HuangYou&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="final/src/styles/tokens.css" />
<style>
  /* ============================================================
   *  Phase A · 大掌柜 主菜单 (fps_0035 重建 → 宋朝古风)
   *  viewport 448×960  竖屏单帧
   *  ──────────────────────────────────────────
   *  分区 (y):
   *    0   – 80   双行 HUD
   *    80  – 130  角色名条 + 红包气泡
   *    130 – 770  街景画布 (远山 / 商街 / NPC×2 / 马车 / 飘心)
   *    770 – 870  任务卡 + 三堆叠卡
   *    870 – 960  底栏 6 Tab
   * ============================================================ */

  /* ───────── 舞台 ───────── */
  .stage {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px 0;
    background:
      radial-gradient(ellipse at 50% 0%, #3d3526 0%, #1a1610 70%, #0e0c08 100%);
  }
  .phone {
    width: var(--vp-w);
    height: var(--vp-h);
    position: relative;
    overflow: hidden;
    border-radius: 36px;
    box-shadow:
      0 0 0 1px #000,
      0 0 0 6px #1c1610,
      0 0 0 7px var(--gold-1),
      0 30px 80px rgba(0,0,0,.6);
    isolation: isolate;
  }
  .menu {
    position: absolute; inset: 0;
    display: grid;
    grid-template-rows: 80px 50px 1fr 100px 90px;
    background: var(--paper-1);
  }

  /* ============================================================
   *  HUD · 双行
   * ============================================================ */
  .hud {
    position: relative;
    z-index: 30;
    background: var(--paper-2);
    border-bottom: 1px solid var(--paper-edge);
    box-shadow: 0 1px 0 rgba(0,0,0,.04), inset 0 -2px 0 var(--gold-1);
    padding: 8px 10px 8px;
    display: grid;
    grid-template-columns: 54px 1.15fr 1.05fr .95fr 38px;
    grid-template-rows: 1fr 1fr;
    column-gap: 6px;
    row-gap: 4px;
    align-items: center;
  }

  /* ── 头像（跨两行） ── */
  .avatar-wrap {
    grid-row: 1 / span 2;
    width: 52px; height: 52px;
    position: relative;
    margin-top: 2px;
    cursor: pointer;
  }
  .avatar-frame {
    width: 52px; height: 52px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 30% 30%, var(--paper-1) 0%, var(--paper-3) 80%);
    border: 2px solid var(--gold-1);
    box-shadow: inset 0 0 0 1px var(--paper-1);
    overflow: hidden;
    display: grid; place-items: center;
    font-family: var(--font-display);
    color: var(--ink-2);
    font-size: 26px;
  }
  .avatar-lv {
    position: absolute;
    bottom: -3px; left: 50%; transform: translateX(-50%);
    background: var(--ink-1); color: var(--paper-1);
    font-family: var(--font-num);
    font-size: 13px;
    padding: 1px 6px;
    border-radius: var(--r-pill);
    border: 1px solid var(--gold-1);
    white-space: nowrap;
    letter-spacing: .02em;
    line-height: 1.2;
  }
  .avatar-dot {
    position: absolute; top: -2px; right: -2px;
    width: 10px; height: 10px;
    background: var(--cinnabar-2);
    border: 1.5px solid var(--paper-1);
    border-radius: 50%;
  }

  /* ── HUD cell ── */
  .hud-cell {
    display: flex;
    align-items: center;
    gap: 4px;
    font-family: var(--font-num);
    font-size: 16px;
    color: var(--ink-1);
    line-height: 1;
    cursor: pointer;
    padding: 2px 0;
    white-space: nowrap;
    overflow: hidden;
  }
  .hud-cell .num { font-weight: var(--fw-medium); letter-spacing: -.02em; }
  .hud-cell .sub {
    font-size: 13px;
    color: var(--ink-3);
    font-family: var(--font-num);
  }
  .pill { white-space: nowrap; padding: 1px 6px; font-size: 13px; }

  /* ── 货币印章 icon ── */
  .ic { width: 22px; height: 22px; display: inline-grid; place-items: center; flex: none; }

  .ic-seal {
    width: 22px; height: 22px;
    border-radius: 3px;
    display: grid; place-items: center;
    font-family: var(--font-display);
    color: var(--paper-1);
    font-size: 15px;
    line-height: 1;
    position: relative;
    flex: none;
  }
  .ic-seal::after {
    content: "";
    position: absolute; inset: 1px;
    border: 1px solid rgba(245,235,214,.3);
    border-radius: 2px;
    pointer-events: none;
  }
  .ic-coin   { background: var(--cur-coin); }
  .ic-jade   { background: var(--cur-jade); }
  .ic-heart  { background: var(--cur-heart); }
  .ic-mood   { background: var(--cur-mood);  color: var(--ink-1); }
  .ic-star   { background: var(--cur-star);  color: var(--ink-1); }
  .ic-coin2  { background: var(--cur-coin2); color: var(--ink-1); }
  .ic-brick  { background: var(--cur-brick); }

  /* ── 齿轮 (允许：圆+齿状方块组合) ── */
  .gear-btn {
    grid-row: 1 / 2;
    grid-column: 5;
    width: 30px; height: 30px;
    border: 1.5px solid var(--ink-2);
    background: var(--paper-1);
    border-radius: 6px;
    display: grid; place-items: center;
    cursor: pointer;
    margin-left: auto;
    position: relative;
  }
  .gear-btn::before {
    content: "";
    width: 14px; height: 14px;
    background:
      conic-gradient(var(--ink-2) 0 12.5%, transparent 0 25%,
                     var(--ink-2) 0 37.5%, transparent 0 50%,
                     var(--ink-2) 0 62.5%, transparent 0 75%,
                     var(--ink-2) 0 87.5%, transparent 0 100%);
    border-radius: 50%;
    -webkit-mask: radial-gradient(circle, transparent 3px, #000 4px);
            mask: radial-gradient(circle, transparent 3px, #000 4px);
  }

  /* ── 日历卡 (column 5 row 2) ── */
  .cal {
    grid-row: 2;
    grid-column: 5;
    width: 38px; height: 38px;
    border: 1.5px solid var(--ink-2);
    background: var(--paper-1);
    border-radius: 4px;
    text-align: center;
    font-family: var(--font-num);
    line-height: 1;
    padding: 2px 0;
    margin-left: auto;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }
  .cal .y { font-size: 8px; color: var(--ink-3); letter-spacing:.05em; line-height:1; }
  .cal .d { font-size: 17px; font-weight: var(--fw-bold); color: var(--ink-1); line-height:1; margin: 2px 0; }
  .cal .m { font-size: 8px; color: var(--cinnabar-1); font-weight: var(--fw-bold); letter-spacing:.05em; line-height:1; }

  /* 牌坊 (顶部装饰) */
  .archway { display: none; }

  /* 蛄都拁塔 silhouette */
  .pagoda {
    position: absolute;
    top: 9%; left: 62%;
    width: 18px; height: 38px;
    z-index: 1;
    opacity: .35;
  }
  .pagoda div { position: absolute; left: 50%; transform: translateX(-50%); background: var(--celadon-3); }
  .pagoda .roof { height: 5px; clip-path: polygon(0 100%, 18% 35%, 50% 0, 82% 35%, 100% 100%); }
  .pagoda .r0 { top: 0; width: 100%; }
  .pagoda .b0 { top: 5px; height: 9px; width: 68%; }
  .pagoda .r1 { top: 14px; width: 88%; }
  .pagoda .b1 { top: 19px; height: 9px; width: 54%; }
  .pagoda .r2 { top: 28px; width: 76%; }
  .pagoda .b2 { top: 33px; height: 9px; width: 42%; }
  .pagoda .r3 { top: 42px; width: 64%; }
  .pagoda .b3 { top: 47px; height: 13px; width: 26%; }

  /* 运河 (街景中部水带) */
  .canal {
    position: absolute;
    left: 0; right: 0;
    top: 30%;
    height: 48px;
    background: linear-gradient(180deg, var(--water-2) 0%, var(--water-1) 100%);
    z-index: 1;
    opacity: .9;
  }
  .canal::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: 0; height: 3px;
    background: repeating-linear-gradient(
      90deg, rgba(78,56,35,.18) 0 5px, transparent 5px 11px);
  }
  /* 小舵 */
  .boat {
    position: absolute;
    width: 26px; height: 6px;
    background: var(--wood-1);
    border-radius: 2px 2px 8px 8px / 2px 2px 6px 6px;
    z-index: 2;
    opacity: .8;
  }
  .boat::after {
    content: "";
    position: absolute;
    top: -5px; left: 50%; transform: translateX(-50%);
    width: 8px; height: 5px;
    background: var(--celadon-3);
    clip-path: polygon(0 100%, 50% 0, 100% 100%);
  }
  .boat1 { top: 32%; left: 14%; }
  .boat2 { top: 33%; left: 46%; width: 24px; }

  /* 拱桥 */
  .bridge {
    position: absolute;
    top: 28%; left: 33%;
    width: 90px; height: 22px;
    z-index: 3;
    pointer-events: none;
  }
  .bridge::before {
    content: "";
    position: absolute;
    inset: 0 0 4px;
    background: transparent;
    border: 1.5px solid var(--paper-edge);
    border-bottom: 0;
    border-radius: 50% 50% 0 0 / 100% 100% 0 0;
    opacity: .7;
  }
  .bridge::after {
    content: "";
    position: absolute;
    bottom: 4px; left: 0; right: 0;
    height: 4px;
    background: #C8B98F;
    border: 1px solid var(--paper-edge);
    border-radius: 1px;
  }

  /* 面人 (远处伊人点) */
  .pedestrian {
    position: absolute;
    width: 5px; height: 12px;
    background: var(--ink-2);
    border-radius: 2px 2px 0 0;
    opacity: .35;
  }

  /* ============================================================
   *  名条 + 红包气泡
   * ============================================================ */
  .name-strip {
    position: relative;
    background: var(--paper-1);
    padding: 8px 12px 6px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid var(--paper-edge);
    z-index: 25;
  }
  .name-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--celadon-3);
    color: var(--paper-1);
    padding: 5px 12px 5px 12px;
    border-radius: var(--r-pill);
    font-family: var(--font-display);
    font-size: 17px;
    letter-spacing: .08em;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.15);
    cursor: pointer;
    white-space: nowrap;
  }
  .name-pill .edit {
    font-family: var(--font-serif);
    font-size: 13px;
    opacity: .85;
    border-left: 1px solid rgba(255,255,255,.3);
    padding-left: 6px;
    margin-left: 2px;
    letter-spacing: 0;
  }
  .name-meta {
    font-family: var(--font-num);
    font-size: 14px;
    color: var(--ink-3);
    line-height: 1.2;
    white-space: nowrap;
  }
  .pause-btn {
    margin-left: auto;
    display: flex;
    gap: 2px;
    align-items: center;
  }
  .pause-btn button {
    width: 24px; height: 24px;
    border: 1px solid var(--ink-3);
    background: var(--paper-2);
    border-radius: 4px;
    font-family: var(--font-num);
    color: var(--ink-1);
    cursor: pointer;
    padding: 0;
    display: grid; place-items: center;
    line-height: 1;
  }
  .pause-btn button:hover { background: var(--paper-3); }

  /* 红包气泡 (悬浮在街景右上) */
  .bonus-bubble {
    position: absolute;
    top: 138px;
    right: 10px;
    width: 64px;
    z-index: 22;
    cursor: pointer;
    text-align: center;
    font-family: var(--font-display);
  }
  .bonus-bubble .pkt {
    width: 56px; height: 64px;
    margin: 0 auto;
    background: linear-gradient(180deg, var(--cinnabar-2), var(--cinnabar-1) 60%, var(--cinnabar-3));
    border-radius: 4px 4px 28px 28px / 4px 4px 18px 18px;
    border: 1.5px solid var(--gold-1);
    color: var(--gold-2);
    font-size: 28px;
    display: grid;
    place-items: center;
    position: relative;
    box-shadow: 0 4px 8px rgba(0,0,0,.18);
  }
  .bonus-bubble .pkt::before {
    content: "";
    position: absolute;
    top: 18%; left: 50%; transform: translateX(-50%);
    width: 22px; height: 22px;
    background: var(--gold-1);
    border-radius: 50%;
    box-shadow: inset 0 0 0 1px var(--cinnabar-1);
  }
  .bonus-bubble .pkt::after { content: "福"; position: relative; color: var(--cinnabar-1); }
  .bonus-bubble .pkt-tag {
    margin-top: 4px;
    display: inline-block;
    background: var(--ink-1);
    color: var(--gold-2);
    font-size: 14px;
    padding: 1px 6px;
    border-radius: var(--r-pill);
    border: 1px solid var(--gold-1);
  }

  /* ============================================================
   *  街景 (130-770)
   * ============================================================ */
  .scene {
    position: relative;
    overflow: hidden;
    background:
      linear-gradient(180deg,
        var(--sky-1) 0%,
        #DDE2DA 22%,
        var(--paper-1) 50%,
        #E5D6B0 75%,
        var(--paper-3) 100%);
  }
  /* 远山 (墨色剪影) — 用 polygon 三角 */
  .mountains {
    position: absolute;
    left: 0; right: 0; top: 8%;
    height: 80px;
    pointer-events: none;
    opacity: 1;
    z-index: 1;
  }
  .mountain {
    position: absolute;
    background: #7E8C92;
    clip-path: polygon(0% 100%, 40% 0%, 70% 30%, 100% 100%);
    opacity: .42;
  }
  .m1 { left: -10%; bottom: 0; width: 60%; height: 80px; }
  .m2 { right: -8%; bottom: 0; width: 70%; height: 100px; opacity: .35;
        clip-path: polygon(0% 100%, 25% 25%, 55% 50%, 80% 5%, 100% 100%); }
  .m3 { left: 25%; bottom: 0; width: 50%; height: 60px; opacity: .25;
        clip-path: polygon(0% 100%, 30% 20%, 60% 60%, 100% 100%); }

  /* 商街 (placeholder 木构楼) */
  .street {
    position: absolute;
    left: 0; right: 0; bottom: 16%;
    height: 44%;
    display: flex;
    align-items: flex-end;
    padding: 0 6px;
    gap: 3px;
    z-index: 4;
  }
  .shop {
    position: relative;
    background: #F0E5C8;
    border: 1px solid var(--wood-2);
    box-shadow: inset 0 0 0 1px #FAF1D5;
  }
  .shop::before {
    content: "";
    position: absolute;
    top: -12px; left: -10px; right: -10px;
    height: 16px;
    background: var(--celadon-3);
    clip-path: polygon(
      0% 100%, 4% 60%, 10% 40%, 18% 28%, 50% 0%,
      82% 28%, 90% 40%, 96% 60%, 100% 100%);
    box-shadow: 0 2px 4px rgba(31,27,20,.18);
  }
  .shop .lattice {     /* 木格窗 */
    position: absolute;
    top: 16%; left: 12%; right: 12%; bottom: 40%;
    background:
      linear-gradient(var(--wood-1), var(--wood-1)) center / 1px 100% no-repeat,
      linear-gradient(90deg, var(--wood-1), var(--wood-1)) center / 100% 1px no-repeat,
      linear-gradient(180deg, #c0a87a, #a08560);
    border: 1px solid var(--wood-2);
  }
  .shop .door {
    position: absolute;
    bottom: 0; left: 38%; width: 24%;
    height: 35%;
    background: var(--wood-2);
    border-top: 1px solid var(--wood-1);
  }
  .shop .banner {       /* 招幌 */
    position: absolute;
    top: 8%; right: -6px;
    width: 14px; height: 60px;
    background: var(--cinnabar-1);
    border: 1px solid var(--wood-2);
    font-family: var(--font-display);
    color: var(--paper-1);
    font-size: 13px;
    text-align: center;
    writing-mode: vertical-rl;
    padding: 4px 0;
    letter-spacing: 2px;
    box-shadow: 0 2px 4px rgba(0,0,0,.18);
  }
  .shop .banner.b2 { background: var(--cinnabar-1); color: var(--paper-1); }
  .shop .banner.b3 { background: var(--celadon-3); color: var(--paper-1); }

  .shop-a { width: 80px; height: 140px; }
  .shop-b { width: 120px; height: 180px; }
  .shop-c { width: 90px; height: 130px; }
  .shop-d { width: 80px; height: 156px; }

  /* 挂在店铺检下的灯笼 */
  .lant-hang {
    position: absolute;
    top: 6px; left: 22%;
    width: 12px; height: 16px;
    background: radial-gradient(circle at 50% 40%, #d88770 0%, var(--cinnabar-1) 60%, var(--cinnabar-3) 100%);
    border-radius: 50% / 60%;
    border: 1px solid var(--gold-1);
    z-index: 5;
  }
  .lant-hang::before {
    content: "";
    position: absolute;
    top: -3px; left: 50%; transform: translateX(-50%);
    width: 1px; height: 4px;
    background: var(--ink-1);
  }
  .lant-hang.r { left: auto; right: 22%; }

  /* 灯笼 */
  .lantern {
    position: absolute;
    width: 22px; height: 28px;
    background: radial-gradient(circle at 50% 40%, #d88770 0%, var(--cinnabar-1) 60%, var(--cinnabar-3) 100%);
    border-radius: 50% / 60%;
    border: 1px solid var(--gold-1);
    box-shadow: 0 0 10px rgba(138,69,51,.35);
  }
  .lantern::before {
    content: "";
    position: absolute;
    top: -6px; left: 50%; transform: translateX(-50%);
    width: 2px; height: 10px;
    background: var(--ink-1);
  }
  .lantern::after {
    content: "";
    position: absolute;
    bottom: -4px; left: 50%; transform: translateX(-50%);
    width: 8px; height: 4px;
    background: var(--gold-1);
    border-radius: 0 0 50% 50%;
  }
  .l1 { top: 5%; left: 4%; opacity: .65; }
  .l2 { top: 8%; right: 6%; opacity: .65; }

  /* 地面 (青砖路) */
  .ground {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 18%;
    background:
      linear-gradient(180deg, #b89668 0%, #8b6f47 100%);
    background-image:
      repeating-linear-gradient(
        90deg,
        rgba(31,27,20,.18) 0, rgba(31,27,20,.18) 1px,
        transparent 1px, transparent 24px),
      repeating-linear-gradient(
        180deg,
        rgba(31,27,20,.1) 0, rgba(31,27,20,.1) 1px,
        transparent 1px, transparent 16px),
      linear-gradient(180deg, #b89668 0%, #8b6f47 100%);
  }

  /* placeholder 字 — 监督 design B 期替换 */
  .ph-label {
    position: absolute;
    background: rgba(31,27,20,.78);
    color: var(--paper-1);
    font-family: ui-monospace, "SF Mono", monospace;
    font-size: 9px;
    padding: 2px 6px;
    border: 1px dashed var(--gold-2);
    white-space: nowrap;
    pointer-events: none;
  }

  .npcs {
    position: absolute;
    left: 28%;
    bottom: 14%;
    display: flex;
    gap: -10px;
    align-items: flex-end;
    cursor: pointer;
    z-index: 7;
  }
  .npc {
    width: 64px; height: 140px;
    position: relative;
    margin-right: -12px;
    filter: drop-shadow(0 4px 3px rgba(31,27,20,.22));
  }
  .npc .head {
    position: absolute;
    top: 0; left: 50%; transform: translateX(-50%);
    width: 36px; height: 36px;
    background: #DEC0A0;
    border-radius: 50%;
    border: 1.5px solid var(--ink-2);
  }
  .npc .body {
    position: absolute;
    top: 32px; left: 50%; transform: translateX(-50%);
    width: 50px;
    height: 104px;
    border-radius: 4px 4px 6px 6px / 6px 6px 4px 4px;
    border: 1.5px solid var(--ink-2);
  }
  .npc.npc-1 .body { background: var(--wood-1); }
  .npc.npc-2 .body { background: var(--celadon-3); }
  .npc.npc-2 .head::after {
    content: "";
    position: absolute;
    top: -7px; left: -3px; right: -3px;
    height: 16px;
    background: var(--cinnabar-1);
    border-radius: 10px 10px 4px 4px;
    border: 1.5px solid var(--ink-2);
  }
  .npc-name {
    position: absolute;
    bottom: 100%;
    left: 50%; transform: translateX(-50%);
    background: rgba(31,27,20,.7);
    color: var(--paper-1);
    font-family: var(--font-display);
    font-size: 14px;
    padding: 1px 8px;
    border-radius: var(--r-pill);
    white-space: nowrap;
    margin-bottom: 4px;
  }

  /* 雕花马车 (place of car) */
  .carriage {
    position: absolute;
    right: 2%;
    bottom: 16%;
    width: 110px;
    height: 64px;
    pointer-events: none;
    z-index: 6;
  }
  .carriage .cab {
    position: absolute;
    left: 18%; right: 8%; top: 0; bottom: 24%;
    background: var(--wood-1);
    border: 2px solid var(--gold-1);
    border-radius: 6px 14px 4px 4px;
  }
  .carriage .cab::after {
    content: "";
    position: absolute;
    top: -10px; left: -4px; right: -4px;
    height: 14px;
    background: var(--ink-1);
    clip-path: polygon(0 100%, 12% 0, 88% 0, 100% 100%);
  }
  .carriage .cab::before {
    content: "馬";

          <div style="padding:10px;background:var(--paper-1);border:1px solid var(--gold-1);border-radius:6px;text-align:center;font-family:var(--font-display)">

const $ = (s, r=document) => r.querySelector(s);
function openModal(name) {
  const m = MODALS[name];
  if (!m) return;
  $('#modalTitle').textContent = m.title;
  const body = $('#modalBody');
  body.innerHTML = m.html();
  body.className = 'modal-body' + (m.scroll ? ' scroll' : '');
  $('#modalBox').className = 'modal modal--' + (m.size || 'md');
  $('#modalRoot').classList.add('open');
}
function closeModal() { $('#modalRoot').classList.remove('open'); }

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const act = t.dataset.act;
  if (act === 'close') return closeModal();
  if (act.startsWith('open:')) {
    const key = act.slice(5);
    const map = {
      'settings':'settings',
      'npc-req':'npc-req',
      'happiness':'happiness',
      'health':'health',
      'star':'happiness',
      'character':'character',
      'rename':'character',
      'income':'character',
      'work-detail':'goals',
      'multi-task':'goals',
      'date':'goals',
      'bonus':'goals',
      'cur-pouch':'goals',
      'shop:money':'shop:money',
      'shop:jade':'shop:money'
    };
    const target = map[key] || 'settings';
    openModal(target);
  }
});

// 主动绑定一下街景 NPC click → npc-req
document.querySelector('.npcs').addEventListener('click', () => openModal('npc-req'));
// HUD ❤ → health
document.querySelectorAll('[data-act="open:health"]').forEach(e => e.addEventListener('click', () => openModal('health')));
// HUD ⭐ / 心境 → 心境(幸福) modal
// 主屏右侧任务卡区域逻辑省略

// === Tweaks ===
const TWEAKS = /*EDITMODE-BEGIN*/{
  "celadon": 50,
  "cinnabar": 50,
  "paperGrain": true,
  "numerals": true
}/*EDITMODE-END*/;

document.getElementById('twBtn').addEventListener('click', () => {
  document.getElementById('twPanel').classList.toggle('open');
});

function persist(edits) {
  Object.assign(TWEAKS, edits);
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({type:'__edit_mode_set_keys', edits}, '*');
  }
}

document.getElementById('tw-celadon').addEventListener('input', (e) => {
  const v = +e.target.value;
  const hue = 160 - (v-50)*0.3;
  const sat = 18 + v*0.3;
  document.documentElement.style.setProperty('--celadon-1', `hsl(${hue}deg ${sat}% 56%)`);
  document.documentElement.style.setProperty('--celadon-3', `hsl(${hue}deg ${sat+8}% 36%)`);
  persist({celadon:v});
});
document.getElementById('tw-cinnabar').addEventListener('input', (e) => {
  const v = +e.target.value;
  const sat = 50 + v*0.5;
  document.documentElement.style.setProperty('--cinnabar-1', `hsl(8deg ${sat}% 46%)`);
  document.documentElement.style.setProperty('--cinnabar-2', `hsl(10deg ${sat-5}% 56%)`);
  persist({cinnabar:v});
});
document.getElementById('tw-paper').addEventListener('change', (e) => {
  document.querySelector('.menu').style.background = e.target.checked
    ? 'var(--paper-1)'
    : '#fff';
  persist({paperGrain:e.target.checked});
});
document.getElementById('tw-jump-style').addEventListener('click', () => {
  window.location.href = 'Style Lock · 风格定档.html';
});
</script>
